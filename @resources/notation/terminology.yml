# terminology.yml — banned / preferred / defined terms + prose conventions.
#
# Consumed by gen/gen_lint.py -> notation-lint.sh (word-boundary grep gates)
# and gen/gen_markdown.py (the human-readable NOTATION.md table).
# A terminology ruling is a PR against this file (see README.md).
#
# Schema:
#   banned:      [{term, use, scope?, ruling}]   # scope optional; default = all prose
#   defined:     [{term, definition, ruling}]
#   conventions: [{rule, ruling}]

banned:
  - term: "\\mathfrak{b} (Euler-weight shorthand)"
    use: "write Rβ𝖦^{−ϱ} out; after identity (I1), Þ_𝖦^ϱ"
    scope: "powerlaw corpus + buffer-stock expositions"
    ruling: {date: 2026-07-17, source: "owner: 'I prohibit you from using \\mathfrak{b}... if you can't find a better option you can just write out the whole expression'"}
  - term: "dual-guise (and 'guise' as a notational term of art)"
    use: "state the convention concretely: functions upright with argument (BST \\cFunc style); italic letters are quantities; single-role letters need no upright form"
    scope: "all corpus prose, comments, instruments, registry glosses"
    ruling: {date: 2026-07-17, source: "owner: 'I'm going to strictly prohibit you from using what you call a textbook dual-guise object'"}
  - term: "dividend"
    use: "the adjustment (the per-period provision moving the buffer stock toward its target)"
    scope: "powerlaw corpus + buffer-stock expositions"
    ruling: {date: 2026-07-16, source: "owner (reactions round 2): connotes a strictly positive flow; an oversized buffer stock adjusts DOWNWARD"}
  - term: "precautionary premium"
    use: "the (Kimball) adjustment"
    scope: "powerlaw corpus + buffer-stock expositions"
    ruling: {date: 2026-07-16, source: "owner (reactions round 2): same sign-connotation objection; credit Kimball, not Arrow–Pratt, for the precautionary object"}
    exception: "the compound 'Kimball Precautionary Premium (KPP)' is SANCTIONED as J's textual name (owner, 2026-07-17: 'you can refer to it textually as the Kimball Precautionary Premium (KPP)'); the bare term stays banned"
  - term: "precautionary debt"
    use: "the buffer stock (the wealth cushion vs the target m̂); x = its financing"
    scope: "powerlaw corpus"
    ruling: {date: 2026-07-16, source: "owner (reactions round 2 + Q-A(ii))"}
  - term: 'production'
    use: 'estimated / estimation'
    scope: "software sense only, in the powerlaw/theory thread's exposition + codebase; economic production functions exempt; committed run logs change only via real re-runs"
    ruling: {date: 2026-07-14, source: 'R5'}
  - term: 'certainty equivalent'
    use: 'perfect foresight'
    ruling: {date: 2026-07-14, source: 'T1'}
  - term: 'target band'
    use: "'the target' / 'the return region around the target m̂'"
    ruling: {date: 2026-07-14, source: 'T3'}

defined:
  - term: 'GIC-cap'
    definition: "β capped a hair below the raw growth-impatience (GIC) boundary; Strong Growth Impatience (GIC-Mod) already fails there — no target exists; at the estimated ceiling calibration even the mean log-drift is positive"
    ruling: {date: 2026-07-14, source: 'T4 + verification blocker fix'}

conventions:
  - rule: "lemmas cited as L0, L1, …; primes mark strengthened variants"
    ruling: {date: 2026-07-14, source: 'C6'}
  - rule: "℘ > 0 is phrased as part of the maintained income-process assumption where load-bearing (WRIC's form, the natural borrowing constraint, κ̄); results that survive ℘ = 0 must say so explicitly"
    ruling: {date: 2026-07-14, source: 'T5'}
  - rule: "bar = optimist / upper bound; underline = pessimist / lower bound (BST's c̄, κ̲; MoM's h̄/h̲, c̄/c̲)"
    ruling: {date: 2026-07-14, source: 'N3'}

  - rule: "r and R, in any font or style, name only a rate of return or a return factor (or a modification of one)"
    ruling: {date: 2026-07-19, source: "owner, BufferStockTheory-Latest session, 14:00:51 EDT: 'a strict prohibition for using the letter r or R or any font or modal (italics, bold, etc) of them for anything other than some version of a rate of return or return factor or some modification thereof'"}
  - rule: "a ring marks the survival-inclusive variant of a symbol: β̊ = βℒ, Þ̊ = (Rβ̊)^{1/ϱ}, R̊ = R/ℒ; the unaccented symbol excludes survival. The ring variants' macros end in Eff, as HARK's DiscFacEff does (\\DiscFacEff, \\APFacEff, \\RPFacEff, \\GPFacEff, \\RfreeEff); HARK's APFac, RPFac and GPFacRaw are the ring variants. \\GPFacLiv is HARK's GPFacLiv, the mortality-adjusted ℒÞ̊_𝖦: the GIC-Liv is \\GPFacLiv < 1"
    ruling: {date: 2026-10-22, source: "owner, econ-ark-tools session, 07:22:54 and 07:27:11 EDT (the ring); the names 11:00:07 ('GPFacLiv < 1 is the correct version of the GIC-Liv') and 11:17:23 ('implement your recs')"}
  - rule: "a time index joins an existing subscript, last: Þ_{R,t}, ξ_{x,t}"
    ruling: {date: 2026-10-22, source: "owner, econ-ark-tools session, 07:47:23 EDT"}
  - rule: "a paper may give a letter the shared files claim to an object the shared files do not cover, declared in the paper's own macro file; never to a shared object"
    ruling: {date: 2026-10-22, source: "owner, econ-ark-tools session, 07:47:23 EDT"}
  - rule: "accent-locality: an accent or decorator may carry more than one meaning, each in its own row with a scope naming the documents, or kinds of document, that use it, provided no single document uses two of its meanings. A document that needs two meanings of one accent writes one of them with another mark, declared in its own macro file. A book's document is a page or chapter, not the whole book. First uses: the bar is an upper bound (N3: BST, MoM) and, scoped, the steady state (\\Steady, the course's growth chapters); the double bar is the golden rule (\\GoldRule); the hat is the target and, scoped, an estimate (\\Est, 2026-11-15). A row without a scope holds wherever no scoped row of the same accent applies. Not yet checked by a tool (notation-lint.sh checks banned terms only)"
    ruling: {date: 2026-11-03, source: "owner, in the cc:course-choice session, 19:17:46 EST: 'The registry should be more open-minded.  It should admit multiple uses for a single decorator/accent, as long as they do not locally conflict in a particular document.'; 19:23:47 EST: 'I do not mean the whole book'; adopted in the econ-ark-tools session, 2026-11-04 19:20:49 EST: 'adopt them'"}
  - rule: "π is inflation, in every paper. A paper that also writes π or Π for another object gives that object another letter; inflation keeps π. First case: HAFiscal, whose HANK appendix wrote inflation ϖ from 2026-10-22 to keep it apart from the paper's transition probabilities π_eu, π_ue and Markov matrix Π; inflation returns to π and those take new letters"
    ruling: {date: 2026-11-05, source: "owner, econ-ark-tools session, 18:15:19 EST: 'It's always bet to keep \\pi as inflation; if you can't figure out why HAFiscal moved inflation off \\pi, move HAFiscal back to inflation as \\pi.'; 19:28:30 EST, choosing inflation back to π with new letters for the transition probabilities and the Markov matrix: '1. inflation goes back'"}
  - rule: "the models' variables (quantities, and functions of the state) follow four rules. A, case: upper case for the aggregate, lower case for the individual. B, weight: bold for a level that can be or will be divided by a normalizer, plain for the normalized version. A normalizer itself is never bold: labor-augmenting productivity Z, in k = 𝑲/(Z𝑳), is one (the course prints it with its own macro, upright Z); labor 𝑳, population 𝑵 and permanent income 𝒑 are levels and stay bold. C, shape: italic for a number, upright for a function; capital Greek numbers too (𝛩, 𝛹, 𝛯, 𝛷, 𝛺), and labels in sub- and superscripts are upright (ξ_u; TractableBufferStock's employment states e and u). D, macros: every object is written with its macro, never as a raw letter; dates and indices, dummy variables, Euler's e, the differential d, numerals and throwaway letters (regression coefficients and errors, a small perturbation) stay raw. Rule D's reach is the Intertemporal Choice course's chapters, handouts and problem sets. Objects that are not the models' variables (factors and rates, parameters, probabilities, shocks, operators and sets, faces with no italic, marks, time) follow their own classes' rules, as their rows record"
    ruling: {date: 2026-11-15, source: "owner, in the cc:course-choice session (as relayed by that session): menu answered 11:51:29 EST, 'Accept (Recommended)': 'The class rules stand as the decisions page lists them.'; 11:46:13 EST, rule D's reach, 'As recommended (Recommended)'; typed 12:07:32 EST: 'labels upright; aggregate C confirmed'. Adopted in the econ-ark-tools session, 2026-11-15 21:41:58 EST: 'Adopt; PR, merge when CI green (Recommended)'. Rule B's normalizer clause, 2026-11-16: owner, in the cc:course-choice session (as relayed by that session), typed 2026-11-16 09:37:55 EST: 'Variables are boldface only when they are levels THAT CAN BE OR WILL BE DIVIDED BY A NORMALIZER.  Z will never be divided by a normalizer.  It is, itself, a normalizer.  Make a clarification to the rule that you have been applying so it will not prompt you again to suggest making Z boldface (or any similar variable).  Also, maybe the registry should have a comment identifying Z as a normalizer, so you'll have an in-context memory of that fact?'; menu answered 09:56:42 EST, on whether labor L, population N or permanent income 𝒑 are normalizers like Z: 'None of these. They all stay bold.' Adopted in the econ-ark-tools session, 2026-11-17 09:13:50 EST: 'One PR, merge when CI green (Recommended)'."}
  - rule: "where nothing is normalized, a document writes the plain macro (\\cNrm) and says once that the normalizer is 1 (c = 𝒄/𝒑 with 𝒑 = 1); where levels grow or the normalizer moves, the levels are bold (\\CLvl), and a normalizer itself (productivity Z) stays plain"
    ruling: {date: 2026-11-15, source: "owner, in the cc:course-choice session (as relayed by that session), menu answered 11:43:46 EST: 'Plain \\cNrm, normalizer = 1 (Recommended)'. Adopted in the econ-ark-tools session, 2026-11-15 21:41:58 EST: 'Adopt; PR, merge when CI green (Recommended)'."}
  - rule: "a log is written log x, through the log macro of x's macro (\\lcNrm = log c; the log row); never as a lower-case letter (k = log 𝑲); r is approximately the log return, so there is no separate log return"
    ruling: {date: 2026-11-15, source: "owner, in the cc:course-choice session (as relayed by that session), typed 10:45:09 EST, and menu answered 11:43:46 EST (the log row quotes both). Adopted in the econ-ark-tools session, 2026-11-15 21:41:58 EST: 'Adopt; PR, merge when CI green (Recommended)'."}
  - rule: "an exception to rule C (X-B4): a Greek letter may name a function, printed bold: \\MPCFunc (bold κ), \\chiFunc (bold χ)"
    ruling: {date: 2026-11-15, source: "owner, in the cc:course-choice session (as relayed by that session), menu answered 11:51:29 EST, against the recommendation: 'Yes, bold Greek for functions': 'Keep X-B4: a Greek letter may name a function, printed bold, as a codified exception.' Adopted in the econ-ark-tools session, 2026-11-15 21:41:58 EST: 'Adopt; PR, merge when CI green (Recommended)'."}
