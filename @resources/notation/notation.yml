# notation.yml — the econark notation registry (single source of truth).
#
# Consumed by gen/gen_latex.py, gen/gen_myst.py, gen/gen_markdown.py.
# Do NOT hand-edit the generated artifacts (econark-notation.sty,
# notation-math.yml, NOTATION.md); edit THIS file and regenerate.
# A notational ruling is a PR against this file (see README.md, RULING_TEMPLATE.md).
#
# Schema (per symbol; see README.md §schema):
#   <semantic-key>:                    # kebab-case; names the OBJECT, never the letter
#     gloss:   "<one line>"
#     define:  "<defining equation, unicode>"          # optional
#     latex:   {macro: '\Xyz', expansion: '<latex>'}   # optional (glosses may omit)
#     unicode: '<glyph(s)>'
#     python:  '<HARKishName>'                          # optional; PROPOSED if not in use
#     aliases: ["<sanctioned alternates + where>"]      # optional
#     dialects: {<key>: {expansion, home, note, status}}   # optional; DECLARED divergences
#     conflicts_checked: "<what was verified against what>"  # optional
#     ruling:  {date, source, rationale}

meta:
  version: 1.0.0        # SemVer: MAJOR = change to an existing rendering/meaning;
  updated: 2026-10-21   #         MINOR = additions; PATCH = gloss/typo fixes
                        # 1.0.0: precautionary-saving re-ruled \pcsNrm/'s' -> \psav/'x'
                        #        (owner, 2026-07-16) + editorial-pass additions;
                        #        amended in-PR 2026-07-17: ruling 9 v2 (guise + \Now/\Nxt)

symbols:

  human-wealth:
    gloss: "normalized human wealth, current period's income INCLUDED (BST eq-HDef)"
    define: "h_t = (1−ℛ^{−(T−t+1)})/(1−ℛ⁻¹);  limit h = 1/(1−ℛ⁻¹) = R/(R−𝒢)"
    latex: {macro: '\hNrm', expansion: 'h'}
    unicode: 'h'
    python: 'hNrm'
    dialects:
      hark-python:
        expansion: 'h − 1'
        home: "HARK's hNrm EXCLUDES the current period"
        note: "verified in HARK source 2026-07-14"
        status: "MIGRATION-PENDING (ruling 4): a SEMANTIC divergence — needs an explicit owner ruling (rename / re-derive / waiver) before any HARK code change; do not touch code from this mission"
    ruling:
      date: 2026-07-14
      source: "BST feedback N1"
      rationale: "one h, BST's; the shadow h_BST and local future-only h are banned"

  vacancy-cost:
    gloss: "vacancy posting cost — the flow cost of keeping a vacancy open, in a search-and-matching block"
    latex: {macro: '\vacCost', expansion: '\mathrm{cst}'}
    unicode: 'cst'
    conflicts_checked: "The SAM literature commonly writes this kappa, and so did HAFiscal's published appendix — but kappa is the MPC here (\\MPC), and the MPC bounds take it decorated (kappa-bar, kappa-underbar). An upright multi-letter name follows convention (1) below and needs no scarce letter."
    ruling: {date: 2026-08-30, source: "owner ruling: 'we mustn't use \\kappa for cost. As long as we are using words for the SAM model, let's just use \\mathrm{cst} for the posting cost'", rationale: "Words for the SAM block: unlimited namespace, self-documenting, and it ends the bidding for scarce Greek in the one block where they ran out."}

  matching-efficiency:
    gloss: "matching-function efficiency — the scale parameter of the Cobb-Douglas matching function"
    define: "matches = eff * searchers^z * vacancies^(1-z)"
    latex: {macro: '\matchEff', expansion: '\mathrm{eff}'}
    unicode: 'eff'
    conflicts_checked: "Written chi in HAFiscal's published appendix. chi is unclaimed upstream, so this moves by CONVENTION (words for the SAM block) rather than to resolve a collision -- kept with its siblings so the block reads as one family."
    ruling: {date: 2026-08-30, source: "owner ruling: words for the SAM block"}

  matching-elasticity:
    gloss: "matching-function elasticity — the searcher exponent in the matching function"
    define: "matches = eff * searchers^z * vacancies^(1-z)"
    latex: {macro: '\matchElas', expansion: 'z'}
    unicode: 'z'
    conflicts_checked: "The one member of this block that keeps a single letter, because it is an EXPONENT: a multi-letter name crowds in e^{els} and tgt^{1-els}, measured against e^{alpha}. Greek was exhausted -- of the three unclaimed lowercase letters, omicron reads as Latin o, upsilon is too close to nu, and iota is too close to 1 and l at superscript size, which is exactly where this symbol lives. Of the lowercase Roman letters, n reads as individual employment beside N (which is employment in this very block) and x is the registry's precautionary-saving (\\psav, ruled 2026-07-16). z is unclaimed in both registry lineages, carries no macro, and appears zero times in the paper; NARK's meaning for it (leisure) is inert in this model."
    ruling: {date: 2026-08-30, source: "owner ruling: 'use z' -- after \\mathrm{els}, \\varkappa, \\upsilon and \\iota were each rejected in turn", rationale: "An exponent needs a single glyph; z is the only one left that is free everywhere and unambiguous at superscript size."}

  vacancy-fill-probability:
    gloss: "probability that a vacancy is filled in a period"
    define: "fill = eff * tgt^(-z)"
    latex: {macro: '\vacFillPrb', expansion: '\mathrm{fill}'}
    unicode: 'fill'
    conflicts_checked: "Written phi in HAFiscal's published appendix, where phi is ALSO subscripted for the wage rule, the Taylor rule and two fiscal rules -- five distinct meanings on one letter, the heaviest overload in that document. phi is additionally NARK's \\prstShkInd and \\eprem. This retires the bare use; the four subscripted ones are a separate question."
    ruling: {date: 2026-08-30, source: "owner ruling: words for the SAM block"}

  job-find-probability:
    gloss: "probability that a searcher finds a job in a period"
    define: "find = eff * tgt^(1-z)"
    latex: {macro: '\jobFindPrb', expansion: '\mathrm{find}'}
    unicode: 'find'
    python: 'job_find'
    conflicts_checked: "Written eta in HAFiscal's published appendix; the registry claims eta subscripted as \\etaL / \\etaR. Named apart from vacancy-fill-probability deliberately: the two differ only as tgt^{1-z} against tgt^{-z}, so a reader had to hold which of eta and phi was which."
    ruling: {date: 2026-08-30, source: "owner ruling: words for the SAM block"}

  labor-market-tightness:
    gloss: "labor-market tightness — vacancies per searcher"
    define: "tgt = vacancies / searchers"
    latex: {macro: '\tightness', expansion: '\mathrm{tgt}'}
    unicode: 'tgt'
    conflicts_checked: "Written Theta in HAFiscal's published appendix; Theta is NARK's \\TranShkAgg and \\TranShkEmp. Note the SAM literature usually writes tightness as lowercase theta, which is NARK's \\tranShkEmp -- so neither case was available."
    ruling: {date: 2026-08-30, source: "owner ruling: words for the SAM block"}

  separation-rate:
    gloss: "job separation rate — the per-period probability an existing match dissolves"
    define: "N_t = (1 - sep) N_{t-1} + fill_t * v_t"
    latex: {macro: '\sepRte', expansion: '\mathrm{sep}'}
    unicode: 'sep'
    python: 'job_sep'
    conflicts_checked: "Convention (1), a word -- not convention (2)'s tilde. The distinction: (2) is for a SAM parameter that has a CLAIM on a particular Greek letter; the separation rate wanted omega only because one paper happened to write it that way, and omega is \\weight. The SAM literature has no settled symbol either (Shimer s, Pissarides lambda, others delta or rho), and all of those are claimed here. A tilde on omega would also have distinguished two symbols by a small visual mark alone, which is the failure that had already disqualified upsilon (too close to nu) and varkappa (too close to kappa)."
    ruling: {date: 2026-08-30, source: "owner rulings: words for the SAM model; and 'I thought we were using \\mathrm{sep} for the separation rate?' correcting an earlier draft that reached for the tilde", rationale: "Words are the DEFAULT for the SAM block; the tilde is the fallback for a parameter with a genuine claim on a taken Greek letter. No current parameter instantiates the fallback."}

  ad-elasticity:
    gloss: "consumption elasticity of the aggregate-demand effect — how strongly income responds to aggregate consumption in a recession"
    define: "AD(C_t) = (C_t / C̃)^Ω in a recession, 1 otherwise; C̃ = steady-state consumption"
    latex: {macro: '\ADElas', expansion: '\Omega'}
    unicode: 'Ω'
    python: 'ADelasticity'
    conflicts_checked: "Written kappa in HAFiscal's published main text, colliding with the MPC (\\MPC); \\varkappa was rejected as too close to kappa. Of the ten capitals that are not Roman lookalikes, Gamma, Delta, Theta and Pi are live in that paper, Xi, Phi and Psi are NARK's, Sigma is the summation operator, and Lambda reads as a Lagrange multiplier. Omega remains. CAVEAT: Omega is econometrics' Hessian / information matrix -- latent here, since HAFiscal deliberately reports no Hessian-based standard errors. HAFiscal's paper also wrote kappa for the vacancy posting cost in its HANK appendix; \\ADElas and \\vacCost separate the two. This row was described in v0.5.0 but left out of this file, so the registry showed Omega as free while econark-shortcuts.sty assigned it -- the failure the weight row records for omega."
    ruling: {date: 2026-08-30, source: "owner rulings 2026-08-30 for the SAM block (notation v0.5.0): not kappa, the MPC, and not varkappa, too close to it", rationale: "Omega is apt rather than merely free: the AD elasticity governs an economy-wide externality, so a capital follows the aggregate/individual convention."}

  splurge:
    gloss: "the splurge — the share of income consumed off the top, outside the optimizing problem"
    define: "c_splurge = splurge * y"
    latex: {macro: '\splurge', expansion: '\gimel'}
    unicode: 'ℷ'
    python: 'Splurge'
    conflicts_checked: "gimel was unclaimed in notation.yml, in econark-shortcuts.sty and in HAFiscal. Greek was exhausted: of the 24 lowercase letters only iota, omicron and upsilon were unclaimed, and all three are confusable with Latin i/o/u (upsilon additionally with nu, NARK's discRte). Hebrew was the fallback on NARK's own precedent (daleth = DeprFac, beth = DiscFacAlt), leaving aleph and gimel; gimel chosen over aleph to avoid the cardinality reading. \\mathfrak{s} was considered and rejected on two grounds. (a) Graceful degradation: KaTeX renders EVERY glyph as a character plus a font class, ordinary italic included, so a missing webfont degrades the whole document rather than fraktur specially — but with fonts absent \\mathfrak{s} falls back to the letter 's', which reads plausibly beside y, whereas gimel emits a real codepoint and falls back to itself. (b) In this corpus \\mathfrak marks VARIANTS of Roman-letter objects (Rport/rport, CEndFunc/cEndFunc), keeping the case=factor/rate convention inside the pair; the splurge is a new primitive share. The genuine KaTeX gap is elsewhere — lowercase mathcal/mathscr/mathbb, which KaTeX has in uppercase only and silently renders as ordinary math italic."
    ruling: {date: 2026-08-30, source: "owner ruling: varsigma is the portfolio share in risky assets; the splurge needs its own letter", rationale: "HAFiscal's published paper writes the splurge as \\varsigma, which is NARK's \\riskyshare. varsigma stays with riskyshare; the splurge moves to gimel — a real Unicode codepoint that degrades to nothing rather than to a different meaningful symbol, and that both KaTeX and MathJax render natively."}

  weight:
    gloss: "a weight — a nonnegative multiplier apportioning mass, probability, or the terms of a mixture"
    latex: {macro: '\weight', expansion: '\omega'}
    unicode: 'ω'
    conflicts_checked: "omega is claimed by no other row here. It is NOT a new assignment: econark-shortcuts.sty on this same branch has carried \\ARKcommand{\\weight}{\\omega} since before this registry existed, so this row transcribes a rule the LaTeX layer already enforces and the YAML had never recorded."
    ruling: {date: 2026-08-30, source: "owner ruling: 'Modify the NARK to use lower-case \\omega for weights'", rationale: "Surfaced by a downstream consumer (HAFiscal) that consulted this registry, found omega unclaimed, and therefore believed it free -- while econark-shortcuts.sty had assigned it all along."}

  wealth-total-pf:
    gloss: "perfect-foresight total ('overall') wealth (human and market), viewed after returns realize on last period's kapital (k_t = a_{t−1}). A FUNCTION of the state, not a constant (owner caution 2026-07-17); written o(m) at definitional sites, italic throughout (\\wbarFunc retired same-PR, owner 2026-07-17)"
    define: "o(m) := b + h = m − 1 + h"
    latex: {macro: '\wbar', expansion: 'o'}
    unicode: 'o'
    python: 'wBarNrm'   # PROPOSED — no HARK use yet
    aliases: ["supersedes w̄ (\\bar{w}, 2026-07-14; the bar was BST's upper-bound mark, and the owner's 2026-07-17 caution was that bars tempt a constant reading); the macro keeps the name \\wbar so documents follow without edits"]
    conflicts_checked: "o is claimed by no macro in econark-shortcuts.sty (only the generic \\oNrm) and by no other row. NARK prohibits uppercase O; the owner named only lowercase o, which NARK records as the exception. Reading hazard: the powerlaw draft also writes little-o, o(·), in its asymptotics (6 times in its math, beside 27 big-O), and total wealth is written o(m) at definitional sites."
    ruling: {date: 2026-10-21, source: "owner: 'I've reconsidered and think total wealth (human + nonhuman) should be just the roman letter o, not \\omicron.' (16:13:06 EDT), reversing his 'NARK and the registry should both use $\\omicron$ for \"overall\" (=total) wealth' (16:05:53 EDT); both typed in the BufferStockTheory-Latest session, relayed, and verified with claude-relay-check"}


  bank-balances:
    gloss: "beginning-of-period nonhuman wealth: returns realized on last period's assets"
    define: "b = ℛa = m − 1 (nonstochastic ℛ; stochastic form b′ = (R/(𝒢ψ′))a)"
    latex: {macro: '\bNrm', expansion: 'b'}
    unicode: 'b'
    python: 'bNrm'
    ruling: {date: 2026-07-14, source: "BST feedback N2 (BST's own b := m−1 overbrace, BufferStockTheory.md MPCminDefn block)"}

  precautionary-saving:
    gloss: "precautionary saving — the eXtra saving induced by precaution: the shortfall of consumption below BST's perfect-foresight rule"
    define: "x(m) := c̄(m) − c(m) = κ̲·o − c(m), written x(o) in the perfect-foresight-wealth coordinate"
    latex: {macro: '\psav', expansion: 'x'}
    unicode: 'x'
    aliases: ["RETIRED 2026-07-16: s(m) and g(w̄) — the pre-ruling symbols (one object now has one symbol; the coordinate shows in the argument). Anchor NAMES retaining g (thm-gT, thm-gC, eq-gap-def) are historical and unchanged."]
    conflicts_checked: "x: \\xNrm in econark-shortcuts.sty is a generic letter macro with no semantic claim; the powerlaw corpus' x₀ validity threshold is unified to w̄₀; x_cut is a code identifier outside prose scope (verified 2026-07-16)"
    ruling: {date: 2026-07-16, source: "owner ruling Q4 (reactions round, verbatim): 'x replaces both, and is defined as eXtra saving (induced by precaution) throughout'; supersedes the 2026-07-14 \\pcsNrm/'s' ruling — MAJOR bump"}

  crra:
    gloss: "coefficient of relative risk aversion"
    latex: {macro: '\CRRA', expansion: '\rho'}
    unicode: 'ρ'
    python: 'CRRA'
    dialects:
      bst-paper:
        expansion: '\gamma'
        home: "BST published draft"
        status: "MIGRATION-PENDING (ruling 4: single dialect across the four; the draft's gamma -> rho migration is owner-gated, do not execute)"
        note: "until migrated, cross-citing docs must state the map (the powerlaw pages' §2 does)"
    ruling: {date: 2026-07-14, source: "powerlaw §2 symbol dictionary + ruling 4"}

  growth-factor:
    gloss: "permanent-income growth factor"
    latex: {macro: '\PermGroFac', expansion: '\mathcal{G}'}
    unicode: '𝒢'
    python: 'PermGroFac'
    aliases: ["supersedes Γ (\\Gamma, 2026-07-14, the powerlaw/HARK dialect)"]
    conflicts_checked: "Now the same as econark-shortcuts.sty's \\PermGroFac and the BST paper's 𝒢, ending the registry's declared divergence from them (DRIFT-AUDIT Category B). Calligraphic, not Roman: Roman G is econark-shortcuts' \\ptyGroFac (productivity growth). It pairs with the rate g as R with r: 𝒢 = 1 + g, so g ≈ ln 𝒢."
    dialects:
      powerlaw-pages:
        expansion: '\Gamma'
        home: "the powerlaw pages define Þ_Γ locally (\\ThornG) and write Γ"
        status: "MIGRATION-PENDING: those pages follow the 2026-10-21 ruling when they switch"
    ruling: {date: 2026-10-21, source: "owner: '`The registry defines g = ln Γ `  It shouldn't do that; at best it should be either g \\approx ln G or \\gamma \\approx ln \\Gamma.' (15:54:40 EDT, typed in the BufferStockTheory-Latest session, relayed, and verified with claude-relay-check); then, choosing between them in the econ-ark-tools session at about 16:37 EDT: 'OK, (B)' (keep g; the factor becomes NARK's calligraphic G)"}

  transitory-shock-all:
    gloss: "the transitory shock, zero-income event included — the same object as econark-shortcuts' \\tranShkInd (owner, 2026-10-21: identical, not distinct)"
    latex: {macro: '\tranShkAll', expansion: '\xi'}
    unicode: 'ξ'
    aliases: ["\\tranShkInd — econark-shortcuts' name for the same shock"]
    conflicts_checked: "ξ is also econark-shortcuts' \\PopnGroRte and \\popGroRte, the population growth rate; that use is DEPRECATED (owner, 2026-10-21) and no replacement has been ruled. econark-shortcuts drew \\tranShkAll in bold (\\pmb{\\xi}) as if it were a different object from \\tranShkInd; it now defines \\tranShkAll as \\tranShkInd."
    dialects:
      powerlaw-pages:
        expansion: '\theta'
        home: "powerlaw corpus writes θ for the shock incl. atom cases"
        note: "BST reserves θ (\\tranShkEmp) for the employed-state shock; ξ = 0 w.p. ℘, else θ/(1−℘)"
        status: "MIGRATION-PENDING (ruling 4; intra-four divergence; direction needs an owner ruling — flag in report)"
    ruling: {date: 2026-10-21, source: "owner: 'the individual transitory shock, and the shock including the zero-income event, are identical, not distinct.  And it should be deprecated for population growth' (typed 16:08:25 EDT in the BufferStockTheory-Latest session; relayed, and verified with claude-relay-check). Earlier: 2026-07-14, BST ass-shocks + powerlaw §2 + ruling 4"}

  permanent-shock:
    gloss: "permanent shock, E[ψ]=1, bounded support"
    latex: {macro: '\permShk', expansion: '\psi'}
    unicode: 'ψ'
    python: 'PermShk'

  zero-income-prob:
    gloss: "probability of the zero-income event (the worst transitory atom)"
    latex: {macro: '\pZero', expansion: '\wp'}
    unicode: '℘'
    python: 'pZero'
    ruling: {date: 2026-07-14, source: "T5: part of the maintained income-process assumption where load-bearing; results surviving ℘=0 say so explicitly"}

  mpc-min:
    gloss: "limiting MPC as m→∞ (PF MPC); pessimist/lower-bound underline"
    define: "κ̲ = 1 − Þ_R"
    latex: {macro: '\MPCmin', expansion: '\underline{\kappa}'}
    unicode: 'κ̲'
    python: 'MPCmin'
    aliases: ["\\kap — the powerlaw pages' macro for the same object (verified 2026-07-14, theory/powerlaw-decay/myst.yml)"]

  mpc-max:
    gloss: "limiting MPC as m→0 (worst-atom)"
    define: "κ̄ = 1 − ℘^{1/ρ}Þ_R"
    latex: {macro: '\MPCmax', expansion: '\overline{\kappa}'}
    unicode: 'κ̄'
    python: 'MPCmax'

  patience-abs:
    gloss: "absolute patience factor"
    define: "Þ = (Rβ)^{1/ρ}"
    latex: {macro: '\APFac', expansion: '\text{Þ}'}
    unicode: 'Þ'
    aliases: ["\\Thorn — the powerlaw pages' macro (\\text{Þ}); verified KaTeX-safe 2026-07-14"]

  patience-return:
    gloss: "return patience factor"
    define: "Þ_R = Þ/R"
    latex: {macro: '\RPFac', expansion: '\text{Þ}_{R}'}
    unicode: 'Þ_R'
    aliases: ["\\ThornR — powerlaw pages"]

  patience-growth:
    gloss: "growth patience factor"
    define: "Þ_𝒢 = Þ/𝒢"
    latex: {macro: '\GPFacRaw', expansion: '\text{Þ}_{\PermGroFac}'}
    unicode: 'Þ_𝒢'
    aliases: ["\\ThornG — powerlaw pages"]

  return-growth-ratio:
    gloss: "growth-normalized return"
    define: "ℛ = R/𝒢"
    latex: {macro: '\RNrmByG', expansion: '\mathcal{R}'}
    unicode: 'ℛ'
    aliases: ["\\Rcal — powerlaw pages (\\mathcal{R})"]

  high-wealth-exponent:
    gloss: "high-wealth decay-exponent characteristic root (random-multiplicative eigenvalue); realized exponent min(1, q_∞)"
    define: "root of E[ψ^{1+q}] = ℛ·Þ_𝒢^q  (ψ≡1: q_∞ = ln ℛ / ln(1/Þ_𝒢))"
    latex: {macro: '\qHi', expansion: 'q_{\infty}'}
    unicode: 'q_∞'
    aliases: ["supersedes q↑ (\\qHi = q{\\uparrow}, 2026-07-14 arrows); earlier q* (\\qstar, q^{*}) pre-2026-07-14"]
    ruling:
      date: 2026-07-16
      source: "owner ruling (supersedes the 2026-07-14 q↑/q↓ arrows): subscript-limit notation — q_∞ (high-wealth, m→∞) / q_0 (constraint end, mᵉ→0)"
      rationale: "each exponent named by the limit it governs; avoids the vector reading of over-/adjacent-arrows; the \\qHi/\\qLo macro NAMES are unchanged, so downstream \\qHi/\\qLo usages need no edits"

  constraint-end-exponent:
    gloss: "constraint-end (bottom-knot) approach exponent — the q_0 partner of the high-wealth q_∞; PROVEN q_0 = ρ"
    define: "MPC deficit κ̄ − c/mᵉ ≍ (mᵉ)^ρ; in MoM coords χ(μ) = μ + b₀ + O(e^{ρμ})"
    latex: {macro: '\qLo', expansion: 'q_{0}'}
    unicode: 'q_0'
    aliases: ["supersedes q↓ (\\qLo = q{\\downarrow}, 2026-07-14 arrows); earlier q° (\\qcirc, q_{\\circ}) 2026-07-13 constraint-end theorem"]
    ruling:
      date: 2026-07-16
      source: "owner ruling (supersedes the 2026-07-14 q↓ arrow): subscript-limit notation q_0 (constraint end, mᵉ→0)"
      rationale: "PROVEN q_0 = ρ (CRRA); q_0 names the constraint limit; avoids the vector reading of arrows; the letter r stays reserved for the interest rate"

  compensation-exponent:
    gloss: "trial/compensation exponent in the detection machinery"
    latex: {macro: '\qtilde', expansion: '\tilde{q}'}
    unicode: 'q̃'
    aliases: ["alt_proof_compactified.md retains s for this internally (declared bridge)"]
    ruling: {date: 2026-07-14, source: "feedback revision: frees the letter s for precautionary saving on reader-facing pages"}

  # --- 2026-07-16 editorial-pass additions (owner rulings Q2/Q3/Q5) ---

  thorn-glyph:
    gloss: "lowercase thorn glyph provision — the RATE partner of Þ; referenced by \\GPRte/\\APRte/\\RPRte in econark-shortcuts.sty, which never defined it (latent-broken until this ruling)"
    latex: {macro: '\thorn', expansion: '\text{þ}'}
    unicode: 'þ'
    conflicts_checked: "KaTeX-safe by the same device as \\Thorn -> \\text{Þ} (verified in the powerlaw myst build 2026-07-16); LaTeX-safe under T1/fontspec"
    ruling: {date: 2026-07-16, source: "owner ruling Q2: glyph availability was the reason Λ had been used instead"}

  growth-rate:
    gloss: "log permanent-income growth rate"
    define: "g ≈ ln 𝒢, with 𝒢 = 1 + g: the rate is arithmetic, as R = 1 + r"
    latex: {macro: '\PermGroRte', expansion: 'g'}
    unicode: 'g'
    conflicts_checked: "matches econark-shortcuts.sty's \\PermGroRte = g (shortcuts also gives g to \\ptyGroRte, productivity growth: a NARK-side overload). The registry's gap row also writes g; its note that g names nothing else is not true while g is this rate, and is a separate question."
    ruling: {date: 2026-10-21, source: "owner: '`The registry defines g = ln Γ `  It shouldn't do that; at best it should be either g \\approx ln G or \\gamma \\approx ln \\Gamma.' (15:54:40 EDT, typed in the BufferStockTheory-Latest session, relayed, and verified with claude-relay-check); then, choosing between them in the econ-ark-tools session at about 16:37 EDT: 'OK, (B)' (keep g; the factor becomes NARK's calligraphic G)"}

  log-growth-patience-rate:
    gloss: "log growth-patience rate — lowercase-thorn partner of Þ_𝒢; NEGATIVE under GIC; the per-period PF descent rate of ln o is −þ_g"
    define: "þ_g := ln Þ_𝒢   (so −þ_g = ln(1/Þ_𝒢) > 0 under GIC; ψ≡1: q_∞ = ln ℛ/(−þ_g))"
    latex: {macro: '\GPRte', expansion: '\thorn_{\PermGroRte}'}
    unicode: 'þ_g'
    aliases: ["RETIRED 2026-07-16: Λ := ln(1/Þ_Γ) — the powerlaw corpus' former positive alias; old formulas read Λ = −þ_g"]
    conflicts_checked: "\\GPRte pre-exists in econark-shortcuts.sty:301 with this exact expansion; this ruling provisions the missing \\thorn glyph (see thorn-glyph) and adopts the macro corpus-wide"
    ruling: {date: 2026-07-16, source: "owner ruling Q2 (reactions round): option (i), sign = ln of the factor; use the existing macro"}

  travel-time-to-target:
    gloss: "periods of perfect-foresight descent from o to the target neighborhood (the log-clock); frees T to mean ONLY the terminal/resumption date"
    define: "n(o) ≈ ln o / (−þ_g)"
    latex: {macro: '\trvTime', expansion: 'n'}
    unicode: 'n'
    aliases: ["supersedes τ (owner ruling Q3, 2026-07-16): τ is econark-shortcuts' \\TaxRte / \\tax and HAFiscal's tax rate"]
    conflicts_checked: "n is claimed by no macro in econark-shortcuts.sty (only the generic \\nNrm) and by no other row here, and HAFiscal's paper does not use it. It stays italic: n names only this function, so the function-vs-quantity convention needs no upright form. One overlap, accepted by the owner: BufferStockTheory writes n for the periods remaining before the terminal date T (\\cFunc_{T-n}, and the powerlaw draft's MPC recursion), also a number of periods but counted back from T rather than forward to the target. The powerlaw draft's shell count n(w̄) = ln(w̄/w̄_a)/(−þ_g) is the same object: its anchor w̄_a and the travel time's ζ differ by an additive constant, which the ≈ in the log-clock already absorbs. The draft's sequence subscripts (delta_n, F_n, M_n) are dummy indices. BufferStockTheory's powerlaw pages switched \\trvTime to n on 2026-10-21. tau was dropped because the 2026-07-16 case for it, glyph reuse across DISJOINT corpora with no fiscal objects in the theory pages, stopped holding once HAFiscal, which writes tau for its tax rate, took its notation from this registry."
    ruling: {date: 2026-10-21, source: "owner: 'I like n for number of periods', then 'yes, go ahead with n', after the audit found the Greek alphabet exhausted for this purpose", rationale: "A number of periods, so n; a single italic glyph because it appears in exponents (Rcal^{-n(w̄)}); and it frees tau for the tax rate everywhere."}

