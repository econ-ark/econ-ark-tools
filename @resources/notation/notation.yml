    latex: {macro: '\etaR', expansion: '\eta_{R}'}
    unicode: 'η_R'
    ruling: {date: 2026-07-16, source: "owner ruling Q3 (reactions round)"}

  buffer-adjustment:
    gloss: "J — textual name THE KIMBALL PRECAUTIONARY PREMIUM (KPP), restored by owner 2026-07-17 (always positive in the asymptotic region, though not monotone in wealth; the SUM of premia grows with each backward step; the analytic formula is asymptotic-only). 'The adjustment' survives only for the buffer-stock-motion concept, which is SIGNED in general (an oversized buffer stock adjusts downward), provably positive in the high-wealth asymptotic region (the forcing floor)"
    define: "o·J(o) → κ̲(ρ+1)σ²/(2Þ_𝒢)   (transitory-only limit)"
    latex: {macro: '\bufAdj', expansion: 'J'}
    unicode: 'J'
    aliases: ["RETIRED same-PR before any consumption: \\KimPrem / 'Kimball precautionary premium' / 'dividend' — banned terms (terminology.yml): they connote a strictly positive flow"]
    conflicts_checked: "J carries only generic letter macros (\\JLvl/\\JNrm/\\JFunc) in econark-shortcuts.sty — no semantic claim (verified 2026-07-16)"
    ruling: {date: 2026-07-17, source: "owner rulings 2026-07-16 (the flow is 'the adjustment') as CORRECTED 2026-07-17: the buffer stock is END-OF-PERIOD ASSETS a (a LEVEL, not a wealth-cushion deviation; target â = m̂ − c(m̂), ℛâ + 1 = m̂ at ψ≡1); 'financing' retired as x's narrative name — x is the discounted stock of adjustments still to be provided"}

