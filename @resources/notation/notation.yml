    latex: {macro: '\etaL', expansion: '\eta_{L}'}
    unicode: 'η_L'
    conflicts_checked: "η unused across econark-shortcuts.sty, local-macros.sty, the MyST maps and BufferStockTheory.tex (verified 2026-07-16); replaces r_L — r reads as an interest rate"
    ruling: {date: 2026-07-16, source: "owner ruling Q3 (reactions round)"}

  gap-remainder-right:
